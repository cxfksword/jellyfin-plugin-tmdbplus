<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TMDbPlus</title>
</head>

<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection verticalSection">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">TMDbPlus 配置</h2><span id="current_version" name="current_version"
                            is="emby-linkbutton" class="emby-button"></span>
                        <a is="emby-linkbutton" class="raised button-alt headerHelpButton emby-button" target="_blank"
                            href="https://github.com/cxfksword/jellyfin-plugin-tmdbplus">源码</a>
                    </div>
                </div>

                <form id="TemplateConfigForm">
                    <fieldset class="verticalSection verticalSection-extrabottompadding">
                        <legend>
                            <h3>TheMovieDb</h3>
                        </legend>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label" for="EnableTmdbOfficialRating">
                                <input id="EnableTmdbOfficialRating" name="EnableTmdbOfficialRating" type="checkbox" is="emby-checkbox" />
                                <span>从TheMovieDb获取影片分级信息</span>
                            </label>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label" for="EnableTmdbAdult">
                                <input id="EnableTmdbAdult" name="EnableTmdbAdult" type="checkbox" is="emby-checkbox" />
                                <span>显示R18评级内容</span>
                            </label>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmdbApiKey">Api Key</label>
                            <input id="TmdbApiKey" name="TmdbApiKey" type="text" is="emby-input" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmdbHost">Api Host</label>
                            <input id="TmdbHost" name="TmdbHost" type="text" is="emby-input" placeholder="api.tmdb.org" />
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="TmdbProxyType">Api代理服务器：</label>
                            <select is="emby-select" id="TmdbProxyType" name="TmdbProxyType"
                                class="TmdbProxyType emby-select-withcolor emby-select">
                                <option value="">禁用</option>
                                <option value="http">HTTP</option>
                                <option value="https">HTTPS</option>
                                <option value="socks5">Socks5</option>
                            </select>
                        </div>
                        <div class="inputContainer tmdb-proxy-wapper">
                            <label class="inputLabel inputLabel-float inputLabelUnfocused"
                                for="TmdbProxyHost">Api代理服务器Host:</label>
                            <input is="emby-input" id="TmdbProxyHost" name="TmdbProxyHost" class="emby-input">
                        </div>
                        <div class="inputContainer tmdb-proxy-wapper">
                            <label class="inputLabel inputLabel-float inputLabelUnfocused"
                                for="TmdbProxyPort">Api代理服务器端口:</label>
                            <input is="emby-input" type="number" id="TmdbProxyPort" name="TmdbProxyPort"
                                pattern="[0-9]*" min="1" max="65535" class="emby-input">
                        </div>
                    </fieldset>
                    <fieldset class="verticalSection verticalSection-extrabottompadding">
                        <legend>
                            <h3>AI翻译角色名</h3>
                        </legend>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label" for="EnableAiTranslateCharacter">
                                <input id="EnableAiTranslateCharacter" name="EnableAiTranslateCharacter" type="checkbox" is="emby-checkbox" />
                                <span>启用AI翻译角色名（将演员的英文角色名翻译为中文）</span>
                            </label>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="AiBaseUrl">OpenAI兼容接口 Base URL</label>
                            <input id="AiBaseUrl" name="AiBaseUrl" type="text" is="emby-input" placeholder="https://api.openai.com/v1" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="AiApiKey">API Key</label>
                            <input id="AiApiKey" name="AiApiKey" type="text" is="emby-input" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="AiModel">模型名称</label>
                            <input id="AiModel" name="AiModel" type="text" is="emby-input" placeholder="gpt-3.5-turbo" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="AiTranslatePrompt">自定义翻译 Prompt（留空使用默认）</label>
                            <textarea id="AiTranslatePrompt" name="AiTranslatePrompt" rows="4" style="width:100%;box-sizing:border-box;" placeholder="下面是影片 {{title}}({{year}}) 每个角色的英文名，每行一个，帮我翻译为对应角色的中文名，输出格式：英文角色名:中文角色名，输出格式也保持每行一个角色名，不需要添加其他说明文字，假如没找到对应的中文角色名，该角色就不需要输出，不要自行直接翻译"></textarea>
                        </div>
                    </fieldset>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </form>
        </div>
        <script type="text/javascript">
            var TemplateConfig = {
                pluginUniqueId: '2792BCF5-FF66-4CA2-A7F3-00B84563F69E'
            };

            document.querySelector('#TemplateConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                        $('#current_version').text('v' + config.Version);
                        document.querySelector('#EnableTmdbAdult').checked = config.EnableTmdbAdult;
                        document.querySelector('#EnableTmdbOfficialRating').checked = config.EnableTmdbOfficialRating;
                        document.querySelector('#TmdbApiKey').value = config.TmdbApiKey;
                        document.querySelector('#TmdbHost').value = config.TmdbHost;
                        document.querySelector('#TmdbProxyType').value = config.TmdbProxyType;
                        document.querySelector('#TmdbProxyHost').value = config.TmdbProxyHost;
                        document.querySelector('#TmdbProxyPort').value = config.TmdbProxyPort;
                        document.querySelector('#EnableAiTranslateCharacter').checked = config.EnableAiTranslateCharacter;
                        document.querySelector('#AiBaseUrl').value = config.AiBaseUrl;
                        document.querySelector('#AiApiKey').value = config.AiApiKey;
                        document.querySelector('#AiModel').value = config.AiModel;
                        document.querySelector('#AiTranslatePrompt').value = config.AiTranslatePrompt;
                        changeProxyDisplay();
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#TemplateConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                        config.EnableTmdbAdult = document.querySelector('#EnableTmdbAdult').checked;
                        config.EnableTmdbOfficialRating = document.querySelector('#EnableTmdbOfficialRating').checked;
                        config.TmdbApiKey = document.querySelector('#TmdbApiKey').value;
                        config.TmdbHost = document.querySelector('#TmdbHost').value;
                        config.TmdbProxyType = document.querySelector('#TmdbProxyType').value;
                        config.TmdbProxyHost = document.querySelector('#TmdbProxyHost').value;
                        config.TmdbProxyPort = document.querySelector('#TmdbProxyPort').value;
                        config.EnableAiTranslateCharacter = document.querySelector('#EnableAiTranslateCharacter').checked;
                        config.AiBaseUrl = document.querySelector('#AiBaseUrl').value;
                        config.AiApiKey = document.querySelector('#AiApiKey').value;
                        config.AiModel = document.querySelector('#AiModel').value;
                        config.AiTranslatePrompt = document.querySelector('#AiTranslatePrompt').value;
                        ApiClient.updatePluginConfiguration(TemplateConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });

            document.querySelector('#TmdbProxyType')
                .addEventListener('change', function () {
                    changeProxyDisplay();
                });

            function changeProxyDisplay() {
                let proxyType = document.querySelector('#TmdbProxyType').value;
                if (proxyType) {
                    $('.tmdb-proxy-wapper').show();
                } else {
                    $('.tmdb-proxy-wapper').hide();
                }
            }
        </script>
    </div>
</body>

</html>
